# XcodeGen spec. Generate the project with:
#
#   brew install xcodegen
#   cd apps/ios && xcodegen generate && open PIXMYD.xcodeproj
#
# The project file is generated rather than committed because a .pbxproj is
# unreviewable in a diff and merges badly — this spec is the source of truth.

name: PIXMYD
options:
  bundleIdPrefix: com.pixmyd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # `complete` was the original setting and it is where this should end up:
    # an ARKit delegate hands frames to a writer on another queue, which is
    # exactly the data race the checker is for. But this app has never been
    # through a compiler that can see UIKit, and turning the strictest
    # diagnostic in Swift on for a first build buries the real errors under
    # hundreds of concurrency ones. `targeted` checks the code that has opted
    # in and leaves the rest as warnings. Raise it once the build is green.
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_BITCODE: NO

targets:
  PIXMYD:
    type: application
    platform: iOS
    sources:
      - path: PIXMYD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixmyd.catch
        PRODUCT_NAME: PIXMYD
        INFOPLIST_FILE: PIXMYD/Info.plist
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # iPhone only. The iPad build was never the point, and dropping it
        # halves what an unverified first build has to get right.
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        # There are no entitlements. There was one —
        # com.apple.developer.networking.wifi-info — which no code used and
        # which a free Apple ID cannot sign, so it would have failed
        # sideloading for a capability the app never asked for.
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreBluetooth.framework
      - sdk: ExternalAccessory.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework

  PIXMYDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PIXMYDTests
    dependencies:
      - target: PIXMYD

schemes:
  PIXMYD:
    build:
      targets:
        PIXMYD: all
        PIXMYDTests: [test]
    test:
      targets:
        - PIXMYDTests
