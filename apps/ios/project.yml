# XcodeGen spec. Generate the project with:
#
#   brew install xcodegen
#   cd apps/ios && xcodegen generate && open PIXMYD.xcodeproj
#
# The project file is generated rather than committed because a .pbxproj is
# unreviewable in a diff and merges badly — this spec is the source of truth.

name: PIXMYD
options:
  bundleIdPrefix: com.pixmyd
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Reality capture is memory-hungry; the extra headroom is not optional on
    # a long scan with depth retained per frame.
    ENABLE_BITCODE: NO

targets:
  PIXMYD:
    type: application
    platform: iOS
    sources:
      - path: PIXMYD
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixmyd.catch
        PRODUCT_NAME: PIXMYD
        INFOPLIST_FILE: PIXMYD/Info.plist
        CODE_SIGN_ENTITLEMENTS: PIXMYD/PIXMYD.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
    dependencies:
      - sdk: ARKit.framework
      - sdk: RealityKit.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      - sdk: CoreLocation.framework
      - sdk: CoreBluetooth.framework
      - sdk: ExternalAccessory.framework
      - sdk: AVFoundation.framework
      - sdk: Network.framework

  PIXMYDTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PIXMYDTests
    dependencies:
      - target: PIXMYD

schemes:
  PIXMYD:
    build:
      targets:
        PIXMYD: all
        PIXMYDTests: [test]
    test:
      targets:
        - PIXMYDTests
