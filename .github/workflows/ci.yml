name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 runs the TypeScript sources directly by stripping types, so there
      # is no build step for the packages or the tests. `tsc --noEmit` is the only
      # thing that actually checks them, which makes it load-bearing rather than
      # advisory: see CONTRIBUTING.md for the erasable-syntax rules this enforces.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the studio
        run: npm --workspace @pixmyd/studio run build
