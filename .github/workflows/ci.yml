name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 runs the TypeScript sources directly by stripping types, so there
      # is no build step for the packages or the tests. `tsc --noEmit` is the only
      # thing that actually checks them, which makes it load-bearing rather than
      # advisory: see CONTRIBUTING.md for the erasable-syntax rules this enforces.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build the studio
        run: npm --workspace @pixmyd/studio run build

  swift:
    name: iOS core (Linux)
    runs-on: ubuntu-latest
    # The reconstruction and export code in the iOS app is pure arithmetic, and
    # it is where a silent bug ruins a survey rather than crashing. apps/ios's
    # Package.swift compiles exactly those files — with a small `simd` shim
    # standing in for Apple's — so they are built and tested on every push
    # instead of only when somebody runs the app on a phone.
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4

      - name: Test
        working-directory: apps/ios
        run: swift test

      # Nothing else in the app can be compiled here, but it can all be parsed,
      # which catches the syntax errors that would otherwise wait for a Mac.
      - name: Parse the rest of the app
        working-directory: apps/ios
        run: |
          status=0
          for file in $(find PIXMYD -name '*.swift'); do
            if ! swift-frontend -parse "$file"; then status=1; fi
          done
          exit $status

# The Xcode build is NOT here. Compiling the SwiftUI, ARKit, CoreLocation and
# Metal half of the app needs a Mac, and a macos-15 job in this workflow was the
# obvious place for it — except that Actions cannot allocate a runner of any
# kind on this account, ubuntu included, so nothing in this file has ever
# executed. Tying the one build that produces an installable app to that being
# fixed was the wrong dependency. It lives in codemagic.yaml instead, whose free
# tier includes macOS instances. See apps/ios/README.md for the install route.
